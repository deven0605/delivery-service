server:
  port: 8086

spring:
  application:
    name: delivery-service

  datasource:
    # Shared H2 file database — auth-service MUST start first (it owns ddl-auto: create
    # for the delivery_partners table). AUTO_SERVER=TRUE lets every service JVM connect
    # to the same file concurrently.
    url: jdbc:h2:file:~/thalicloud-data/thalidb;AUTO_SERVER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 'update' only: this service reads/writes columns auth-service already
      # defined on delivery_partners, and owns kyc_documents outright (created
      # here, untouched by auth-service's ddl-auto:create on its own tables).
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

# Must match auth-service's JWT secret exactly so tokens issued at OTP verification
# are accepted here without a round-trip to auth-service.
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-expiry-ms: 900000   # 15 min — used only for expiry validation

# Local MinIO (Tech Stack: "Document Upload — local MinIO now, AWS S3 future).
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: delivery-kyc-documents

# FR-2.6 — enforced again server-side (client-side check alone is not trustworthy).
document:
  max-file-size-bytes: 5242880   # 5 MB
  allowed-content-types: image/jpeg,image/png,application/pdf

# M4.1 — Phase 1 dev-only shared secret for the internal assignment-dispatch
# endpoints (POST /api/delivery/internal/assignments/**, /api/delivery/internal/dispatch).
# order-service now calls the latter when a vendor accepts an order (see
# OrderDispatchController), and this service calls back into order-service's
# own internal endpoint after a pickup/delivery OTP match (see
# OrderStatusCallbackClient) — both directions share this same dev secret.
# Same placeholder spirit as the hardcoded OTP — in production these routes
# would sit behind service-to-service auth and not be reachable from the
# public gateway at all.
internal:
  dispatch-key: dev-only-internal-dispatch-key

services:
  order-service:
    base-url: http://localhost:8083

# FR-4.3 — default countdown before an unactioned offer auto-expires.
assignment:
  offer-ttl-seconds: 60

# FR-7.3 — Cash in Hand must reach this before "Remit to ThaliCloud" is available.
cash:
  remittance-threshold-paise: 200000   # ₹2,000 default

# FR-10.3 — below this, the Home dashboard shows an advisory banner (no
# auto-suspension in Phase 1).
rating:
  low-threshold: 3.5

# M13/FR-13.3 — backs the SOS/"Call Support" shortcut shown during an active
# delivery. Phase 1 placeholder number/mailbox, same spirit as the hardcoded OTP.
support:
  phone-number: "+911800123456"
  email: partner-support@thalicloud.example

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%C{1}.%M:%L] - %msg%n"
  file:
    name: D:/logs/backend/delivery-service/.logs
  level:
    com.thalicloud: DEBUG
    org.springframework.security: INFO
